---
# ConfigMap for Application Configuration
# Stores non-sensitive configuration data
apiVersion: v1
kind: ConfigMap
metadata:
  name: python-app-config
  namespace: production
  labels:
    app: python-app
    component: config
data:
  # Application version
  APP_VERSION: "1.0.0"
  
  # Environment name
  ENVIRONMENT: "production"
  
  # Logging configuration
  LOG_LEVEL: "INFO"
  
  # Application settings
  APP_NAME: "Python Flask Application"
  
  # Feature flags
  ENABLE_DEBUG: "false"
  ENABLE_METRICS: "true"

---
# Secret for Sensitive Configuration
# Stores sensitive data like API keys, passwords, etc.
# Note: Values must be base64 encoded
apiVersion: v1
kind: Secret
metadata:
  name: python-app-secret
  namespace: production
  labels:
    app: python-app
    component: secret
type: Opaque
data:
  # Example API key (base64 encoded: "your-api-key-here")
  API_KEY: eW91ci1hcGkta2V5LWhlcmU=
  
  # Example database password (base64 encoded: "your-db-password")
  DB_PASSWORD: eW91ci1kYi1wYXNzd29yZA==
  
  # Example secret token (base64 encoded: "your-secret-token")
  SECRET_TOKEN: eW91ci1zZWNyZXQtdG9rZW4=

---
# ConfigMap for Development Environment
apiVersion: v1
kind: ConfigMap
metadata:
  name: python-app-config
  namespace: development
  labels:
    app: python-app
    component: config
data:
  APP_VERSION: "1.0.0-dev"
  ENVIRONMENT: "development"
  LOG_LEVEL: "DEBUG"
  APP_NAME: "Python Flask Application (Dev)"
  ENABLE_DEBUG: "true"
  ENABLE_METRICS: "false"

---
# Secret for Development Environment
apiVersion: v1
kind: Secret
metadata:
  name: python-app-secret
  namespace: development
  labels:
    app: python-app
    component: secret
type: Opaque
data:
  # Development credentials (base64 encoded)
  API_KEY: ZGV2LWFwaS1rZXk=
  DB_PASSWORD: ZGV2LXBhc3N3b3Jk
  SECRET_TOKEN: ZGV2LXRva2Vu

