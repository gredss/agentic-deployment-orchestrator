---
# Route for Python Flask Application
# OpenShift-specific resource for external access to the application
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: python-app
  namespace: production
  labels:
    app: python-app
    component: backend
  annotations:
    description: "External route for Python Flask application"
    haproxy.router.openshift.io/timeout: "60s"
    haproxy.router.openshift.io/balance: "roundrobin"
spec:
  # Hostname (optional - OpenShift will generate if not specified)
  # host: python-app-production.apps.your-cluster.com
  
  # Target service
  to:
    kind: Service
    name: python-app
    weight: 100
  
  # Port to route to
  port:
    targetPort: http
  
  # TLS configuration for HTTPS
  tls:
    # Termination type: edge, passthrough, or reencrypt
    termination: edge
    # Redirect HTTP to HTTPS
    insecureEdgeTerminationPolicy: Redirect
  
  # Wildcard policy
  wildcardPolicy: None

---
