---
# Route for Development Environment
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: python-app
  namespace: development
  labels:
    app: python-app
    component: backend
    environment: development
  annotations:
    description: "Development route for Python Flask application"
spec:
  to:
    kind: Service
    name: python-app
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

