apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
  namespace: production
  labels:
    app: python-app
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: python-app
        version: v1
    spec:
      containers:
      - name: python-app
        # Using a simple Python web server image
        image: python:3.9-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install flask gunicorn &&
            cat > /app/app.py << 'PYEOF'
            from flask import Flask, jsonify
            app = Flask(__name__)
            @app.route("/")
            def home():
                return "Deployment successful"
            @app.route("/health")
            def health():
                return jsonify({"status": "healthy"})
            if __name__ == "__main__":
                app.run(host="0.0.0.0", port=8080)
            PYEOF
            cd /app && gunicorn --bind 0.0.0.0:8080 --workers 2 app:app
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5

