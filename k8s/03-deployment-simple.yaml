apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
  namespace: production
  labels:
    app: python-app
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: python-app
        version: v1
    spec:
      # OpenShift runs containers with random UIDs for security
      # We need to ensure writable directories
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: python-app
        # Using a simple Python web server image
        image: python:3.9-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            # Create writable directories for OpenShift random UID
            mkdir -p /tmp/app /tmp/.local /tmp/.cache &&
            export HOME=/tmp &&
            export PATH="/tmp/.local/bin:$PATH" &&
            
            # Install packages to /tmp/.local (writable location)
            pip install --user flask gunicorn &&
            
            # Create Flask app in /tmp/app
            cat > /tmp/app/app.py << 'PYEOF'
            from flask import Flask, jsonify
            import os
            
            app = Flask(__name__)
            
            @app.route("/")
            def home():
                return "Deployment successful! Running on OpenShift"
            
            @app.route("/health")
            def health():
                return jsonify({"status": "healthy", "pod": os.environ.get("HOSTNAME", "unknown")})
            
            @app.route("/ready")
            def ready():
                return jsonify({"status": "ready"})
            
            if __name__ == "__main__":
                app.run(host="0.0.0.0", port=8080)
            PYEOF
            
            # Run gunicorn from /tmp/app
            cd /tmp/app && exec gunicorn --bind 0.0.0.0:8080 --workers 2 --timeout 120 app:app
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5

