apiVersion: v1
kind: Service
metadata:
  name: {APP_NAME}
  namespace: {NAMESPACE}
  labels:
    app: {APP_NAME}
    managed-by: bob-orchestrator
spec:
  selector:
    app: {APP_NAME}
  ports:
  - name: http
    port: 80
    targetPort: {PORT}
    protocol: TCP
  type: ClusterIP

