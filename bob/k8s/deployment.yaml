apiVersion: apps/v1
kind: Deployment
metadata:
  name: bob-orchestrator
  namespace: production
  labels:
    app: bob-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bob-orchestrator
  template:
    metadata:
      labels:
        app: bob-orchestrator
    spec:
      serviceAccountName: jenkins-sa
      containers:
      - name: bob-orchestrator
        image: python:3.9-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /tmp/.local && \
            export HOME=/tmp && \
            export PATH=/tmp/.local/bin:$PATH && \
            pip install --user --no-cache-dir Flask==3.0.0 requests==2.31.0 gunicorn==21.2.0 kubernetes==28.1.0 && \
            cd /app && \
            /tmp/.local/bin/gunicorn --bind 0.0.0.0:5000 --workers 2 orchestrator:app
        volumeMounts:
        - name: app-code
          mountPath: /app
        ports:
        - containerPort: 5000
          name: http
        env:
        # OpenShift API Configuration
        - name: OPENSHIFT_API_URL
          value: "https://kubernetes.default.svc"
        - name: OPENSHIFT_TOKEN
          valueFrom:
            secretKeyRef:
              name: bob-secrets
              key: openshift-token
        - name: OPENSHIFT_NAMESPACE
          value: "production"
        - name: DEFAULT_DEPLOY_ENV
          value: "production"
        - name: REQUEST_TIMEOUT
          value: "30"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: app-code
        configMap:
          name: bob-orchestrator-code-v2

